name: generate github stats

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the main branch
  push:
    branches:
    - main

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    steps:
    # Check out repository under $GITHUB_WORKSPACE, so the job can access it
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        repository: SaegusaMayumi1234/github-stats
        token: ${{ secrets.GH_PAT }}
    
    # Run using Python 3.8 for consistency and aiohttp
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    - name: Build
      run: |
        zig build

    # Generate all statistics images
    - name: Generate images
      run: |
        ./zig-out/bin/github-stats
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
        EXCLUDE_PRIVATE: "false"
        SILENT: "true"
        # TODO: Remove this when they get their API working again
        # https://github.com/orgs/community/discussions/192970
        MAX_RETRIES: 5

    - name: Verify output
      run: |
        echo "Working directory: $(pwd)"
        echo "Generated directory contents:"
        ls -lah generated

    # push the content of <build_dir> to a branch
    # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
    - name: Push to the output branch
      uses: crazy-max/ghaction-github-pages@v5
      with:
        target_branch: github-stats
        build_dir: generated
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
